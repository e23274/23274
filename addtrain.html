<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>當天車輛調度看板 (精確至秒)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background-color: #1a1b1e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin: 0 0 14px 0;
      color: #ffffff;
      font-size: 22px;
    }

    /* 頂部控制面板 */
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background-color: #262a34;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      margin-bottom: 16px;
      width: 100%;
      max-width: 1320px;
      justify-content: center;
      align-items: center;
    }
    .panel-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .badge-b {
      background-color: #2563eb;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 5px;
      font-weight: bold;
    }
    .badge-e {
      background-color: #16a34a;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 5px;
      font-weight: bold;
    }
    select, input {
      background-color: #333846;
      border: 1px solid #4b5563;
      color: #ffffff;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 13px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #3b82f6;
    }
    input[type="number"] {
      width: 65px;
      text-align: center;
    }
    .btn-action {
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .btn-reset {
      background-color: #4b5563;
      color: #ffffff;
    }
    .btn-apply {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-upload {
      background-color: #10b981; 
      color: #ffffff;
      margin-left: auto; 
    }
    .btn-action:hover {
      opacity: 0.85;
    }
    .btn-upload:disabled {
      background-color: #6ee7b7;
      cursor: not-allowed;
    }

    /* 微調提示條 */
    .edit-hint {
      width: 100%;
      max-width: 1320px;
      margin: -6px 0 12px 0;
      padding: 6px 12px;
      border-radius: 6px;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #93c5fd;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    /* 看板表格容器 */
    #board-container {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      overflow-x: auto;
      max-height: 82vh;
      width: 100%;
      max-width: 1320px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: center;
      color: #0f172a;
    }
    thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }
    th {
      background-color: #1e293b;
      color: #ffffff;
      padding: 9px 6px;
      font-weight: 600;
      border: 1px solid #334155;
    }
    tr.sub-header th {
      background-color: #2c3e50;
      font-size: 12px;
      padding: 5px 6px;
      color: #cbd5e1;
    }

    th.th-blue, tr.sub-header th.th-blue {
      background-color: #1d4ed8;
      min-width: 100px;
    }
    th.th-green, tr.sub-header th.th-green {
      background-color: #15803d;
      min-width: 100px;
    }

    td {
      padding: 7px 8px;
      border: 1px solid #e2e8f0;
      white-space: nowrap;
    }
    tr:nth-child(even) {
      background-color: #f8fafc;
    }
    tr:hover {
      background-color: #f1f5f9;
    }

    /* 錨點端點時間：紅色粗體 */
    .time-anchor {
      color: #dc2626 !important;
      font-weight: bold !important;
    }

    /* B 欄錨點區間：淺藍色 */
    .cell-b-range {
      background-color: #dbeafe !important;
      color: #1e40af;
      font-weight: 500;
    }

    /* E 欄錨點區間：亮黃色 */
    .cell-e-range {
      background-color: #fef08a !important;
      color: #854d0e;
      font-weight: 500;
    }

    /* 新時間加亮字體 */
    .cell-modified-b {
      color: #1d4ed8;
      font-weight: bold;
      background-color: #eff6ff;
    }
    .cell-modified-e {
      color: #15803d;
      font-weight: bold;
      background-color: #f0fdf4;
    }
    .cell-audit {
      color: #64748b;
      font-size: 13px;
    }
    .msg-box {
      padding: 40px;
      text-align: center;
      color: #64748b;
      font-size: 15px;
    }

    /* 更動區間內可長按微調之班型(D)與姓名(G) */
    td.cell-editable-dg {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: background-color 0.15s, box-shadow 0.15s;
    }
    td.cell-editable-dg.has-content {
      cursor: grab;
      background-color: #f8fafc;
      box-shadow: inset 0 0 0 1px #cbd5e1;
    }
    td.cell-editable-dg.has-content:hover {
      background-color: #e0f2fe;
      box-shadow: inset 0 0 0 1px #38bdf8;
    }
    td.cell-drop-slot {
      background-color: #fef3c7 !important;
      color: #b45309 !important;
      font-weight: bold;
      box-shadow: inset 0 0 0 2px #f59e0b !important;
    }

    /* 跟隨滑鼠或手指的懸浮卡片 */
    .drag-ghost-pill {
      position: fixed;
      z-index: 10000;
      pointer-events: none;
      background-color: #1e293b;
      color: #fbbf24;
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
      transform: translate(-50%, -50%);
    }
    .drag-ghost-pill.is-touch {
      transform: translate(-50%, -140%);
    }

    /* 防誤觸確認視窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.65);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-box {
      background-color: #262a34;
      border: 1px solid #4b5563;
      border-radius: 10px;
      padding: 24px 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      min-width: 300px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
      color: #f87171;
      margin-bottom: 22px;
      letter-spacing: 0.5px;
    }
    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .btn-modal {
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-modal:hover {
      opacity: 0.85;
    }
    .btn-confirm {
      background-color: #10b981;
      color: #ffffff;
    }
    .btn-cancel {
      background-color: #4b5563;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <h2>當天車輛調度看板 (精確至秒)</h2>

  <div class="control-panel">
    <div class="panel-group">
      <span class="badge-b">B 欄加車</span>
      <label>起始：</label>
      <select id="bStart"><option value="">--請選擇--</option></select>
      <label>結束：</label>
      <select id="bEnd"><option value="">--請選擇--</option></select>
      <label>發車數量：</label>
      <input type="number" id="bCount" value="" min="1" placeholder="台數">
    </div>

    <div class="panel-group">
      <span class="badge-e">E 欄加車</span>
      <label>起始：</label>
      <select id="eStart"><option value="">--請選擇--</option></select>
      <label>結束：</label>
      <select id="eEnd"><option value="">--請選擇--</option></select>
      <label>發車數量：</label>
      <input type="number" id="eCount" value="" min="1" placeholder="台數">
    </div>

    <button type="button" class="btn-action btn-reset" id="btnReset">清除重設</button>
    <button type="button" class="btn-action btn-apply" id="btnApply">套用加車計算</button>
    <button type="button" class="btn-action btn-upload" id="btnUpload">上傳至試算表</button>
  </div>

  <div id="editHint" class="edit-hint">
    💡 提示：更動區間內的「班型＋姓名」可長按約 0.3 秒取下並上下拖曳調整位置（其餘班次自動遞補）
  </div>

  <div id="board-container">
    <div id="loading" class="msg-box">資料載入中，請稍候...</div>
    <table id="dataTable" style="display: none;">
      <thead>
        <tr>
          <th>欄位 C</th>
          <th class="th-blue">新 B 時間</th>
          <th>欄位 B</th>
          <th>欄位 D</th>
          <th>欄位 G</th>
          <th class="th-green">新 E 時間</th>
          <th>欄位 E</th>
          <th>欄位 F</th>
        </tr>
        <tr class="sub-header">
          <th>方向2車號</th>
          <th class="th-blue"></th>
          <th>方向2時間</th>
          <th>班型</th>
          <th>姓名</th>
          <th class="th-green"></th>
          <th>方向1時間</th>
          <th>方向1車號</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <div class="modal-title">⚠️ 上傳後不能修改</div>
      <div class="modal-actions">
        <button type="button" class="btn-modal btn-confirm" id="btnConfirmUpload">確定上傳</button>
        <button type="button" class="btn-modal btn-cancel" id="btnCancelUpload">取消上傳</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxMkTahf3GyuECOhpIeWDrwa0H4slg6b_CDnz0qgtAKTm4FDB-PjhJShaWU0lavlDBNNA/exec";
    const UPLOAD_URL = "https://script.google.com/macros/s/AKfycbwYHT6YdVUr-ozWCRBn-owZgL6QL_pk0c2SJ1pYAz67E-XQAVYYUfg9DOyy4tg1AwJ5/exec";

    let rawList = [];
    let currentExportData = []; 

    let bAnchors = [];
    let eAnchors = [];
    let bOrigTimes = [null, null, null, null];
    let eOrigTimes = [null, null, null, null];

    let bEarly = { start: null, end: null };
    let bLate  = { start: null, end: null };
    let eEarly = { start: null, end: null };
    let eLate  = { start: null, end: null };

    // 修正：將 makeRange 放在全域範圍，供 init 與 updateTable 共同呼叫
    function makeRange(idxA, idxB) {
      if (idxA !== null && idxB !== null) {
        return { start: Math.min(idxA, idxB), end: Math.max(idxA, idxB) };
      }
      return { start: null, end: null };
    }

    function formatTo24HourTime(val) {
      if (val === null || val === undefined || val === "") return "";
      let res = "";
      if (typeof val === "string") {
        val = val.trim();
        if (!val || val.includes("#N/A") || val.includes("N/A")) return "";
        val = val.replace(/\s+/g, ":");
        const m = val.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
        if (m) {
          const hh = m[1].padStart(2, "0");
          const mm = m[2];
          const ss = m[3] ? m[3].padStart(2, "0") : "00";
          res = `${hh}:${mm}:${ss}`;
        } else {
          try {
            const d = new Date(val);
            if (!isNaN(d.getTime())) res = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
            else res = val;
          } catch(e) { res = val; }
        }
      } else if (typeof val === "number") {
        if (val === 0) return "";
        if (val > 0 && val < 1) {
          const totalSec = Math.round(val * 86400);
          const hh = String(Math.floor(totalSec / 3600)).padStart(2, "0");
          const mm = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
          const ss = String(totalSec % 60).padStart(2, "0");
          res = `${hh}:${mm}:${ss}`;
        } else {
          res = String(val);
        }
      } else {
        try {
          if (val instanceof Date) res = `${String(val.getHours()).padStart(2, '0')}:${String(val.getMinutes()).padStart(2, '0')}:${String(val.getSeconds()).padStart(2, '0')}`;
          else res = String(val);
        } catch(e) { res = String(val); }
      }
      if (res === "00:00:00") return "";
      return res;
    }

    function timeToSeconds(tStr) {
      if (!tStr) return NaN;
      const parts = tStr.split(":").map(Number);
      if (parts.length === 2) return parts[0] * 3600 + parts[1] * 60;
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      return NaN;
    }

    function secondsToTime(totalSec) {
      totalSec = Math.round(totalSec) % 86400;
      if (totalSec < 0) totalSec += 86400;
      const hh = String(Math.floor(totalSec / 3600)).padStart(2, "0");
      const mm = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      const ss = String(totalSec % 60).padStart(2, "0");
      return `${hh}:${mm}:${ss}`;
    }

    function isInsideRange(idx, early, late) {
      const inEarly = early.start !== null && early.end !== null && idx > early.start && idx < early.end;
      const inLate  = late.start !== null && late.end !== null && idx > late.start && idx < late.end;
      return inEarly || inLate;
    }

    function isTimeInAnchor(tSec, times) {
      if (isNaN(tSec)) return false;
      let [e1, e2, l1, l2] = times;
      let inE = (e1 !== null && e2 !== null) && tSec > Math.min(e1, e2) && tSec < Math.max(e1, e2);
      let inL = (l1 !== null && l2 !== null) && tSec > Math.min(l1, l2) && tSec < Math.max(l1, l2);
      return inE || inL;
    }

    // 錨點內端點減 150 秒算均分，只要在錨點內就加回 150 秒，外側一律不加
    function generateSmartTripTimes(startStr, endStr, count, origTimes) {
      if (!startStr || !endStr || !count || count <= 0) return [];
      const startSec = timeToSeconds(startStr);
      const endSec = timeToSeconds(endStr);
      if (isNaN(startSec) || isNaN(endSec) || endSec < startSec) return [];

      if (count === 1) return [secondsToTime(startSec)];

      const startIn = isTimeInAnchor(startSec, origTimes);
      const endIn = isTimeInAnchor(endSec, origTimes);
      const OFFSET = 150; // 150 秒 (2分30秒)

      // 兩點都在內或都在外：直接均分
      if ((startIn && endIn) || (!startIn && !endIn)) {
        const step = (endSec - startSec) / (count - 1);
        const times = [];
        for (let i = 0; i < count; i++) {
          times.push(secondsToTime(startSec + i * step));
        }
        return times;
      }

      // 一點在內、一點在外：在錨點內的端點預扣 150 秒
      const adjStart = startIn ? (startSec - OFFSET) : startSec;
      const adjEnd   = endIn   ? (endSec - OFFSET)   : endSec;
      const step     = (adjEnd - adjStart) / (count - 1);

      const times = [];
      for (let i = 0; i < count; i++) {
        const baseT = adjStart + i * step;
        
        let inAnchor = false;
        if (i === 0) {
          inAnchor = startIn;
        } else if (i === count - 1) {
          inAnchor = endIn;
        } else {
          // 中間班次：若加上 150 秒後落在錨點時間範圍內，即屬於錨點內
          inAnchor = isTimeInAnchor(baseT + OFFSET, origTimes);
        }

        // 錨點內的加回 150 秒，外側不加
        const finalT = inAnchor ? (baseT + OFFSET) : baseT;
        times.push(secondsToTime(finalT));
      }

      return times;
    }

    async function init() {
      try {
        const response = await fetch(API_URL);
        const result = await response.json();
        if (result.status !== "success") {
          document.getElementById("loading").innerText = "讀取錯誤: " + result.message;
          return;
        }

        const allData = result.data;
        const rawRows = allData.slice(8, 500);
        rawList = [];

        const bTimesSet = new Set();
        const eTimesSet = new Set();

        for (let row of rawRows) {
          const item = {
            c: row[2] !== undefined ? String(row[2]).trim() : "",
            b: formatTo24HourTime(row[1]),
            d: row[3] !== undefined ? String(row[3]).trim() : "",
            g: row[6] !== undefined ? String(row[6]).trim() : "",
            e: formatTo24HourTime(row[4]),
            f: row[5] !== undefined ? String(row[5]).trim() : ""
          };

          if (Object.values(item).some(v => v !== "")) {
            rawList.push(item);
            if (item.b && item.b.includes(":")) bTimesSet.add(item.b);
            if (item.e && item.e.includes(":")) eTimesSet.add(item.e);
          }
        }

        function getCellInt(row1Based, colLetter) {
          const r = row1Based - 1;
          const c = colLetter === 'O' ? 14 : 15;
          if (allData[r] && allData[r][c] !== undefined && allData[r][c] !== "") {
            const rawVal = String(allData[r][c]).trim();
            if (rawVal.includes("#N/A") || rawVal.includes("N/A")) return null;
            const v = parseInt(rawVal, 10);
            return isNaN(v) ? null : v;
          }
          return null;
        }

        const bIdx26 = getCellInt(26, 'O');
        const bIdx27 = getCellInt(27, 'O');
        const bIdx34 = getCellInt(34, 'O');
        const bIdx35 = getCellInt(35, 'O');

        const eIdx26 = getCellInt(26, 'P');
        const eIdx27 = getCellInt(27, 'P');
        const eIdx34 = getCellInt(34, 'P');
        const eIdx35 = getCellInt(35, 'P');

        bEarly = makeRange(bIdx26, bIdx27);
        bLate  = makeRange(bIdx34, bIdx35);
        eEarly = makeRange(eIdx26, eIdx27);
        eLate  = makeRange(eIdx34, eIdx35);

        bAnchors = [bIdx26, bIdx27, bIdx34, bIdx35].filter(idx => idx !== null);
        eAnchors = [eIdx26, eIdx27, eIdx34, eIdx35].filter(idx => idx !== null);

        bOrigTimes = [bIdx26, bIdx27, bIdx34, bIdx35].map(idx => (idx !== null && rawList[idx]) ? timeToSeconds(rawList[idx].b) : null);
        eOrigTimes = [eIdx26, eIdx27, eIdx34, eIdx35].map(idx => (idx !== null && rawList[idx]) ? timeToSeconds(rawList[idx].e) : null);

        populateDropdown("bStart", bTimesSet);
        populateDropdown("bEnd", bTimesSet);
        populateDropdown("eStart", eTimesSet);
        populateDropdown("eEnd", eTimesSet);

        document.getElementById("loading").style.display = "none";
        document.getElementById("dataTable").style.display = "table";

        updateTable();
      } catch (e) {
        document.getElementById("loading").style.display = "block";
        document.getElementById("loading").innerText = "無法載入資料，請確認網路連線！(" + e.message + ")";
      }
    }

    function populateDropdown(elemId, timeSet) {
      const select = document.getElementById(elemId);
      select.innerHTML = '<option value="">--請選擇--</option>';
      timeSet.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
      });
    }

    function createMergedRow(bItem, eItem) {
      return {
        c: bItem ? bItem.c : "",
        newBTime: bItem ? bItem.oldB : "",
        b: bItem ? bItem.time : "",
        d: bItem ? bItem.d : "",
        g: bItem ? bItem.g : "",
        newETime: eItem ? eItem.oldE : "",
        e: eItem ? eItem.time : "",
        f: eItem ? eItem.f : "",
        isBModified: bItem ? bItem.isModified : false,
        isEModified: eItem ? eItem.isModified : false,
        isAnchorB: false,
        isAnchorE: false,
        inBRange: false,
        inERange: false
      };
    }

    function updateTable() {
      const bStart = document.getElementById("bStart").value;
      const bEnd = document.getElementById("bEnd").value;
      const bCount = parseInt(document.getElementById("bCount").value, 10);

      const eStart = document.getElementById("eStart").value;
      const eEnd = document.getElementById("eEnd").value;
      const eCount = parseInt(document.getElementById("eCount").value, 10);

      const hasB = Boolean(bStart && bEnd && bCount > 0);
      const hasE = Boolean(eStart && eEnd && eCount > 0);

      // 未設定加車時，直接呈現原始班表與原錨點
      if (!hasB && !hasE) {
        renderRows(rawList.map((r, idx) => ({
          c: r.c, newBTime: "", b: r.b, d: r.d, g: r.g,
          newETime: "", e: r.e, f: r.f,
          isBModified: false, isEModified: false,
          isAnchorB: bAnchors.includes(idx),
          isAnchorE: eAnchors.includes(idx),
          inBRange: isInsideRange(idx, bEarly, bLate) && !bAnchors.includes(idx),
          inERange: isInsideRange(idx, eEarly, eLate) && !eAnchors.includes(idx)
        })));
        return;
      }

      const bStartIdx = hasB ? rawList.findIndex(r => r.b === bStart) : -1;
      const bEndIdx = hasB ? rawList.findIndex(r => r.b === bEnd) : -1;
      const eStartIdx = hasE ? rawList.findIndex(r => r.e === eStart) : -1;
      const eEndIdx = hasE ? rawList.findIndex(r => r.e === eEnd) : -1;

      const validBStart = (hasB && bStartIdx !== -1) ? bStartIdx : Infinity;
      const validEStart = (hasE && eStartIdx !== -1) ? eStartIdx : Infinity;
      let segStart = Math.min(validBStart, validEStart);
      
      const validBEnd = (hasB && bEndIdx !== -1) ? bEndIdx : -1;
      const validEEnd = (hasE && eEndIdx !== -1) ? eEndIdx : -1;
      let segEnd = Math.max(validBEnd, validEEnd);

      const bNewList = (hasB && bStartIdx !== -1 && bEndIdx >= bStartIdx)
        ? generateSmartTripTimes(bStart, bEnd, bCount, bOrigTimes)
        : [];
      const eNewList = (hasE && eStartIdx !== -1 && eEndIdx >= eStartIdx)
        ? generateSmartTripTimes(eStart, eEnd, eCount, eOrigTimes)
        : [];

      let bQueue = [];
      let eQueue = [];

      for (let i = segStart; i <= segEnd; i++) {
        if (hasB && i === bStartIdx) {
          const origBCount = bEndIdx - bStartIdx + 1;
          const totalBItems = Math.max(bNewList.length, origBCount);
          for (let k = 0; k < totalBItems; k++) {
            const origIdx = k < origBCount ? (bStartIdx + k) : -1;
            const r = origIdx !== -1 ? rawList[origIdx] : null;
            const bTime = k < bNewList.length ? bNewList[k] : "";
            bQueue.push({
              time: bTime, timeSec: timeToSeconds(bTime),
              c: r ? r.c : "", oldB: r ? r.b : "", d: r ? r.d : "", g: r ? r.g : "",
              isModified: k < bNewList.length
            });
          }
          i = bEndIdx; 
        } else if (rawList[i]) {
          const r = rawList[i];
          bQueue.push({
            time: r.b, timeSec: timeToSeconds(r.b),
            c: r.c, oldB: "", d: r.d, g: r.g,
            isModified: false
          });
        }
      }

      for (let i = segStart; i <= segEnd; i++) {
        if (hasE && i === eStartIdx) {
          const origECount = eEndIdx - eStartIdx + 1;
          const totalEItems = Math.max(eNewList.length, origECount);
          for (let k = 0; k < totalEItems; k++) {
            const origIdx = k < origECount ? (eStartIdx + k) : -1;
            const r = origIdx !== -1 ? rawList[origIdx] : null;
            const eTime = k < eNewList.length ? eNewList[k] : "";
            eQueue.push({
              time: eTime, timeSec: timeToSeconds(eTime),
              oldE: r ? r.e : "", f: r ? r.f : "",
              isModified: k < eNewList.length
            });
          }
          i = eEndIdx; 
        } else if (rawList[i]) {
          const r = rawList[i];
          eQueue.push({
            time: r.e, timeSec: timeToSeconds(r.e),
            oldE: "", f: r.f,
            isModified: false
          });
        }
      }

      let mergedRows = [];
      let bIdx = 0;
      let eIdx = 0;

      while (bIdx < bQueue.length || eIdx < eQueue.length) {
        let bItem = bIdx < bQueue.length ? bQueue[bIdx] : null;
        let eItem = eIdx < eQueue.length ? eQueue[eIdx] : null;

        if (bItem && eItem) {
          let bSec = bItem.timeSec;
          let eSec = eItem.timeSec;

          if (isNaN(bSec) || isNaN(eSec)) {
            mergedRows.push(createMergedRow(bItem, eItem));
            bIdx++; eIdx++;
            continue;
          }

          let isBInside = isTimeInAnchor(bSec, bOrigTimes);
          let isEInside = isTimeInAnchor(eSec, eOrigTimes);
          
          let thresholdSec = 630; // 都在外：10 分 30 秒
          if (isBInside && isEInside) thresholdSec = 270; // 都在內：4.5 分鐘
          else if (isBInside || isEInside) thresholdSec = 420; // 一內一外：7 分鐘

          let diff = eSec - bSec;
          if (diff < -43200) diff += 86400;
          else if (diff > 43200) diff -= 86400;
          
          if (diff >= thresholdSec) {
            mergedRows.push(createMergedRow(bItem, eItem));
            bIdx++; eIdx++;
          } else {
            mergedRows.push(createMergedRow(null, eItem));
            eIdx++;
          }
        } else if (bItem) {
          mergedRows.push(createMergedRow(bItem, null));
          bIdx++;
        } else if (eItem) {
          mergedRows.push(createMergedRow(null, eItem));
          eIdx++;
        }
      }

      let displayRows = [];
      for (let i = 0; i < segStart; i++) {
        let r = rawList[i];
        displayRows.push({
          c: r.c, newBTime: "", b: r.b, d: r.d, g: r.g,
          newETime: "", e: r.e, f: r.f,
          isBModified: false, isEModified: false,
          isAnchorB: false, isAnchorE: false, inBRange: false, inERange: false
        });
      }

      displayRows = displayRows.concat(mergedRows);

      for (let i = segEnd + 1; i < rawList.length; i++) {
        let r = rawList[i];
        displayRows.push({
          c: r.c, newBTime: "", b: r.b, d: r.d, g: r.g,
          newETime: "", e: r.e, f: r.f,
          isBModified: false, isEModified: false,
          isAnchorB: false, isAnchorE: false, inBRange: false, inERange: false
        });
      }

      // 動態重新尋標：尋找最接近且 <= 原錨點時間 的位置作為新錨點
      function findNewAnchor(Ta, col) {
        if (Ta === null || isNaN(Ta)) return null;
        let bestIdx = -1;
        let bestDiff = Infinity;
        for (let i = 0; i < displayRows.length; i++) {
          let t = timeToSeconds(displayRows[i][col]);
          if (!isNaN(t)) {
            let diff = Ta - t;
            if (diff >= 0 && diff < bestDiff) {
              bestDiff = diff;
              bestIdx = i;
            }
          }
        }
        return bestIdx !== -1 ? bestIdx : null;
      }

      let newBIndices = bOrigTimes.map(Ta => findNewAnchor(Ta, 'b'));
      let newEIndices = eOrigTimes.map(Ta => findNewAnchor(Ta, 'e'));

      newBIndices.forEach(idx => { if (idx !== null) displayRows[idx].isAnchorB = true; });
      newEIndices.forEach(idx => { if (idx !== null) displayRows[idx].isAnchorE = true; });

      let nBEarly = makeRange(newBIndices[0], newBIndices[1]);
      let nBLate  = makeRange(newBIndices[2], newBIndices[3]);
      let nEEarly = makeRange(newEIndices[0], newEIndices[1]);
      let nELate  = makeRange(newEIndices[2], newEIndices[3]);

      for (let i = 0; i < displayRows.length; i++) {
        if (!displayRows[i].isAnchorB) {
          displayRows[i].inBRange = isInsideRange(i, nBEarly, nBLate);
        }
        if (!displayRows[i].isAnchorE) {
          displayRows[i].inERange = isInsideRange(i, nEEarly, nELate);
        }
      }

      renderRows(displayRows);
    }

    // 取得更動區間（包含區間內穿插的純 B 欄或純 E 欄列）
    function getEditableZones(rows) {
      let bMin = Infinity, bMax = -1;
      let eMin = Infinity, eMax = -1;
      rows.forEach((r, idx) => {
        if (r.isBModified) {
          if (idx < bMin) bMin = idx;
          if (idx > bMax) bMax = idx;
        }
        if (r.isEModified) {
          if (idx < eMin) eMin = idx;
          if (idx > eMax) eMax = idx;
        }
      });
      const zones = [];
      if (bMax >= bMin) zones.push({ start: bMin, end: bMax });
      if (eMax >= eMin) zones.push({ start: eMin, end: eMax });
      if (zones.length === 2) {
        zones.sort((a, b) => a.start - b.start);
        if (zones[1].start <= zones[0].end + 1) {
          return [{ start: zones[0].start, end: Math.max(zones[0].end, zones[1].end) }];
        }
      }
      return zones;
    }

    // 長按拖曳狀態管理（支援桌機滑鼠與手機／平板觸控）
    let pressTimer = null;
    let pendingPress = null;
    let dragState = {
      active: false,
      pointerId: null,
      isTouch: false,
      zoneStart: -1,
      zoneEnd: -1,
      origIdx: -1,
      currentIdx: -1,
      draggedD: "",
      draggedG: "",
      basePairs: [],
      ghostEl: null,
      lastClientY: 0,
      scrollRaf: null
    };

    function clearPendingPress() {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      pendingPress = null;
    }

    function computePreviewPairs(targetIdx) {
      const pairs = dragState.basePairs.map(p => ({ ...p }));
      const fromOffset = dragState.origIdx - dragState.zoneStart;
      const toOffset = targetIdx - dragState.zoneStart;
      const [moved] = pairs.splice(fromOffset, 1);
      pairs.splice(toOffset, 0, moved);
      return pairs;
    }

    function updateDragPreview(targetIdx) {
      const tbody = document.getElementById("tableBody");
      const previewPairs = computePreviewPairs(targetIdx);
      for (let rIdx = dragState.zoneStart; rIdx <= dragState.zoneEnd; rIdx++) {
        const tr = tbody.children[rIdx];
        if (!tr) continue;
        const dCell = tr.querySelector(".col-d");
        const gCell = tr.querySelector(".col-g");
        const item = previewPairs[rIdx - dragState.zoneStart];
        if (dCell && gCell && item) {
          dCell.textContent = item.d;
          gCell.textContent = item.g;
          const isTarget = rIdx === targetIdx;
          dCell.classList.toggle("cell-drop-slot", isTarget);
          gCell.classList.toggle("cell-drop-slot", isTarget);
        }
      }
    }

    function findTargetRowInZone(clientY) {
      const tbody = document.getElementById("tableBody");
      let chosenIdx = dragState.currentIdx;
      for (let rIdx = dragState.zoneStart; rIdx <= dragState.zoneEnd; rIdx++) {
        const tr = tbody.children[rIdx];
        if (!tr) continue;
        const rect = tr.getBoundingClientRect();
        if (clientY >= rect.top && clientY <= rect.bottom) {
          return rIdx;
        }
      }
      const firstTr = tbody.children[dragState.zoneStart];
      const lastTr = tbody.children[dragState.zoneEnd];
      if (firstTr && clientY < firstTr.getBoundingClientRect().top) {
        chosenIdx = dragState.zoneStart;
      } else if (lastTr && clientY > lastTr.getBoundingClientRect().bottom) {
        chosenIdx = dragState.zoneEnd;
      }
      return chosenIdx;
    }

    function startAutoScrollLoop() {
      const container = document.getElementById("board-container");
      function step() {
        if (!dragState.active) return;
        const rect = container.getBoundingClientRect();
        const edge = 46;
        let delta = 0;
        if (dragState.lastClientY < rect.top + edge) {
          delta = -8;
        } else if (dragState.lastClientY > rect.bottom - edge) {
          delta = 8;
        }
        if (delta !== 0) {
          container.scrollTop += delta;
          const newTarget = findTargetRowInZone(dragState.lastClientY);
          if (newTarget !== dragState.currentIdx) {
            dragState.currentIdx = newTarget;
            updateDragPreview(newTarget);
          }
        }
        dragState.scrollRaf = requestAnimationFrame(step);
      }
      dragState.scrollRaf = requestAnimationFrame(step);
    }

    function finishDrag(commit) {
      if (!dragState.active) return;
      if (dragState.scrollRaf) {
        cancelAnimationFrame(dragState.scrollRaf);
        dragState.scrollRaf = null;
      }
      if (dragState.ghostEl) {
        dragState.ghostEl.remove();
        dragState.ghostEl = null;
      }
      document.getElementById("board-container").style.touchAction = "";
      document.body.style.userSelect = "";

      if (commit) {
        const finalPairs = computePreviewPairs(dragState.currentIdx);
        for (let rIdx = dragState.zoneStart; rIdx <= dragState.zoneEnd; rIdx++) {
          const item = finalPairs[rIdx - dragState.zoneStart];
          if (currentExportData[rIdx] && item) {
            currentExportData[rIdx].d = item.d;
            currentExportData[rIdx].g = item.g;
          }
        }
      }

      dragState.active = false;
      dragState.pointerId = null;
      renderRows(currentExportData);
    }

    function startLongPressDrag(info) {
      const { rowIdx, zone, clientX, clientY, pointerId, isTouch } = info;
      const row = currentExportData[rowIdx];
      if (!row || (!row.d && !row.g)) return;

      if (navigator.vibrate) {
        try { navigator.vibrate(25); } catch (_) {}
      }

      const basePairs = [];
      for (let i = zone.start; i <= zone.end; i++) {
        basePairs.push({
          d: currentExportData[i].d || "",
          g: currentExportData[i].g || ""
        });
      }

      const ghost = document.createElement("div");
      ghost.className = "drag-ghost-pill" + (isTouch ? " is-touch" : "");
      const labelD = row.d || "(無班型)";
      const labelG = row.g || "(無姓名)";
      ghost.textContent = `${labelD} ｜ ${labelG}`;
      ghost.style.left = clientX + "px";
      ghost.style.top = clientY + "px";
      document.body.appendChild(ghost);

      document.getElementById("board-container").style.touchAction = "none";
      document.body.style.userSelect = "none";

      dragState = {
        active: true,
        pointerId,
        isTouch,
        zoneStart: zone.start,
        zoneEnd: zone.end,
        origIdx: rowIdx,
        currentIdx: rowIdx,
        draggedD: row.d || "",
        draggedG: row.g || "",
        basePairs,
        ghostEl: ghost,
        lastClientY: clientY,
        scrollRaf: null
      };

      updateDragPreview(rowIdx);
      startAutoScrollLoop();
    }

    window.addEventListener("pointermove", (e) => {
      if (pendingPress && e.pointerId === pendingPress.pointerId) {
        const dist = Math.hypot(e.clientX - pendingPress.startX, e.clientY - pendingPress.startY);
        if (dist > 8) {
          clearPendingPress();
        } else {
          pendingPress.clientX = e.clientX;
          pendingPress.clientY = e.clientY;
        }
      }

      if (dragState.active && e.pointerId === dragState.pointerId) {
        e.preventDefault();
        if (dragState.ghostEl) {
          dragState.ghostEl.style.left = e.clientX + "px";
          dragState.ghostEl.style.top = e.clientY + "px";
        }
        dragState.lastClientY = e.clientY;
        const targetIdx = findTargetRowInZone(e.clientY);
        if (targetIdx !== dragState.currentIdx) {
          dragState.currentIdx = targetIdx;
          updateDragPreview(targetIdx);
        }
      }
    }, { passive: false });

    window.addEventListener("pointerup", (e) => {
      if (pendingPress && e.pointerId === pendingPress.pointerId) {
        clearPendingPress();
      }
      if (dragState.active && e.pointerId === dragState.pointerId) {
        finishDrag(true);
      }
    });

    window.addEventListener("pointercancel", (e) => {
      if (pendingPress && e.pointerId === pendingPress.pointerId) {
        clearPendingPress();
      }
      if (dragState.active && e.pointerId === dragState.pointerId) {
        finishDrag(false);
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && dragState.active) {
        finishDrag(false);
      }
    });

    function renderRows(rows) {
      currentExportData = rows; 
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      const zones = getEditableZones(rows);
      const editHint = document.getElementById("editHint");
      if (editHint) {
        editHint.style.display = zones.length > 0 ? "block" : "none";
      }

      rows.forEach((r, idx) => {
        const tr = document.createElement("tr");
        const zone = zones.find(z => idx >= z.start && idx <= z.end);

        let bClass = r.isAnchorB ? "time-anchor" : r.isBModified ? "cell-modified-b" : r.inBRange ? "cell-b-range" : "";
        let eClass = r.isAnchorE ? "time-anchor" : r.isEModified ? "cell-modified-e" : r.inERange ? "cell-e-range" : "";

        const hasDG = Boolean(r.d || r.g);
        const dgExtraClass = zone ? ("cell-editable-dg" + (hasDG ? " has-content" : "")) : "";

        tr.innerHTML = `
          <td>${r.c}</td>
          <td class="cell-audit">${r.newBTime}</td>
          <td class="${bClass}">${r.b}</td>
          <td class="col-d ${dgExtraClass}">${r.d}</td>
          <td class="col-g ${dgExtraClass}">${r.g}</td>
          <td class="cell-audit">${r.newETime}</td>
          <td class="${eClass}">${r.e}</td>
          <td>${r.f}</td>
        `;

        if (zone) {
          const dCell = tr.querySelector(".col-d");
          const gCell = tr.querySelector(".col-g");
          [dCell, gCell].forEach(cell => {
            cell.addEventListener("contextmenu", (ev) => ev.preventDefault());
            cell.addEventListener("pointerdown", (ev) => {
              if (ev.pointerType === "mouse" && ev.button !== 0) return;
              const curRow = currentExportData[idx];
              if (!curRow || (!curRow.d && !curRow.g)) return;

              clearPendingPress();
              pendingPress = {
                rowIdx: idx,
                zone,
                pointerId: ev.pointerId,
                isTouch: ev.pointerType === "touch" || ev.pointerType === "pen",
                startX: ev.clientX,
                startY: ev.clientY,
                clientX: ev.clientX,
                clientY: ev.clientY
              };
              pressTimer = setTimeout(() => {
                if (pendingPress) {
                  const info = pendingPress;
                  clearPendingPress();
                  startLongPressDrag(info);
                }
              }, 300);
            });
          });
        }

        tbody.appendChild(tr);
      });
    }

    document.getElementById("btnApply").addEventListener("click", updateTable);

    document.getElementById("btnReset").addEventListener("click", () => {
      document.getElementById("bStart").value = "";
      document.getElementById("bEnd").value = "";
      document.getElementById("bCount").value = "";
      document.getElementById("eStart").value = "";
      document.getElementById("eEnd").value = "";
      document.getElementById("eCount").value = "";
      updateTable();
    });

    const confirmModal = document.getElementById("confirmModal");

    document.getElementById("btnUpload").addEventListener("click", () => {
      if (!currentExportData || currentExportData.length === 0) {
        alert("目前沒有資料可以上傳！");
        return;
      }
      confirmModal.style.display = "flex";
    });

    document.getElementById("btnCancelUpload").addEventListener("click", () => {
      confirmModal.style.display = "none";
    });

    document.getElementById("btnConfirmUpload").addEventListener("click", async () => {
      confirmModal.style.display = "none";

      const btn = document.getElementById("btnUpload");
      btn.innerText = "資料上傳中...";
      btn.disabled = true;

      try {
        const response = await fetch(UPLOAD_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          redirect: "follow", 
          body: JSON.stringify({ data: currentExportData })
        });
        
        const result = await response.json();
        if (result.status === "success") {
          alert("上傳成功！已成功覆蓋更新： " + result.sheetName);
        } else {
          alert("上傳失敗：" + result.message);
        }
      } catch (error) {
        alert("發生錯誤，請檢查網路連線或 Apps Script 權限設定。\n錯誤訊息: " + error);
      } finally {
        btn.innerText = "上傳至試算表";
        btn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
