<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動更新即時影像</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: white;
            font-family: sans-serif;
            flex-direction: column;
        }
        .image-container {
            max-width: 90%;
            max-height: 85vh;
            text-align: center;
        }
        img {
            max-width: 100%;
            max-height: 80vh;
            border: 4px solid #ecf0f1;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        p {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img id="liveImage" src="https://pub-ed0e7ba24bef47cdab89e74cd8d81f90.r2.dev/live.jpg" alt="即時影像加載中...">
        <p id="statusText">圖片每 7 秒自動更新一次...</p>
    </div>

    <script>
        const imgElement = document.getElementById('liveImage');
        const statusText = document.getElementById('statusText');
        const baseUrl = 'https://pub-ed0e7ba24bef47cdab89e74cd8d81f90.r2.dev/live.jpg';

        // 設定定時器，每 7000 毫秒（7秒）執行一次
        setInterval(() => {
            // 取得當前時間戳
            const timestamp = new Date().getTime();
            
            // 在網址後方加上時間戳參數 (?t=...) 
            // 這樣可以騙過瀏覽器，強制它重新下載最新圖片，而不會讀取舊的快取
            imgElement.src = `${baseUrl}?t=${timestamp}`;
            
            // 更新狀態文字顯示最後更新時間
            const now = new Date();
            statusText.innerText = `最後更新時間: ${now.toLocaleTimeString()} (每 7 秒自動更新)`;
        }, 7000);
    </script>

</body>
</html>
