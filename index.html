<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文湖線車務段 - 列車進站倒數看板</title>
    <style>
        /* 頁面基本樣式：高對比、適合站台或辦公室觀看 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: #2d2d2d;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin-top: 0;
            color: #ffd700;
            font-size: 24px;
            letter-spacing: 1px;
        }

        /* 狀態列 */
        #statusText {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 15px;
            background: #222;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        /* --- 新增：跑馬燈區塊樣式 --- */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            background-color: #111;
            border: 1px solid #444;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none; /* 預設隱藏，有資料才顯示 */
        }

        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            padding: 8px 0;
            color: #ff9900;
            font-size: 16px;
            font-weight: bold;
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(500px); }
            100% { transform: translateX(-100%); }
        }
        /* -------------------------- */

        /* 下拉選單區塊 */
        .control-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .control-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        label {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: #444;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: #ffd700;
        }

        /* 主要看板顯示區 */
        .display-board {
            background-color: #111;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 25px;
            margin-top: 15px;
        }

        #locationDisplay {
            font-size: 22px;
            color: #00ff00;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #countdownDisplay {
            font-size: 48px;
            font-weight: bold;
            color: #ffffff;
            margin: 10px 0;
            transition: color 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>列車進站倒數監控</h1>
        <div id="statusText">系統初始化中...</div>

        <div class="marquee-container" id="marqueeContainer">
            <div class="marquee-content" id="marqueeText"></div>
        </div>

        <div class="control-group">
            <div class="control-item">
                <label for="directionSelect">選擇監測方向</label>
                <select id="directionSelect">
                    <option value="方向一">方向一 (E欄)</option>
                    <option value="方向二">方向二 (B欄)</option>
                </select>
            </div>
            <div class="control-item">
                <label for="alertSelect">預警變色秒數</label>
                <select id="alertSelect">
                    <option value="30">30 秒</option>
                    <option value="45" selected>45 秒</option>
                    <option value="60">60 秒</option>
                </select>
            </div>
        </div>

        <div class="display-board">
            <div id="locationDisplay">相對位置：讀取中...</div>
            <div id="countdownDisplay">-- 秒</div>
        </div>
    </div>

    <script>
        // 【已自動帶入】您提供的正確完整 GAS 網頁應用程式網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxMkTahf3GyuECOhpIeWDrwa0H4slg6b_CDnz0qgtAKTm4FDB-PjhJShaWU0lavlDBNNA/exec";

        // 全域暫存快取：用於儲存從雲端成功抓到的最新資料
        let globalDataCache = null; 

        // 全域變數：紀錄上一次播報過的名字/位置，避免重複播報
        let lastSpokenLocation = null;

        /**
         * 核心功能 1：從 GAS 代理伺服器悄悄抓取最新 Excel/Google Sheet 資料
         */
        function fetchTrainData() {
            console.log("正在透過 GAS 代理安全抓取『當天車號』資料...");
            
            fetch(GAS_URL)
                .then(response => response.json())
                .then(res => {
                    if (res.status === "success") {
                        console.log("🎉 雲端資料同步成功！");
                        globalDataCache = res.data; // 寫入暫存
                        document.getElementById("statusText").innerText = "雲端狀態：已同步最新車次 (語音功能就緒)";
                        document.getElementById("statusText").style.color = "#00ff00";
                        
                        // --- 呼叫跑馬燈更新 ---
                        updateMarquee(globalDataCache);
                        // ---------------------

                        // 抓完立即更新一次畫面
                        processTrainLogic(globalDataCache); 
                    } else {
                        console.error("GAS 後台回傳錯誤:", res.message);
                        handleFetchFailure("雲端內部解析錯誤，已啟用歷史暫存");
                    }
                })
                .catch(error => {
                    console.error("連線至 GAS 失敗（網路問題或遭防火牆封鎖）:", error);
                    handleFetchFailure("網路連線阻斷，已啟用歷史暫存");
                });
        }

        /**
         * 輔助防護：抓取失敗時的保險降級機制
         */
        function handleFetchFailure(reasonText) {
            const statusEl = document.getElementById("statusText");
            statusEl.innerText = `狀態：${reasonText}`;
            statusEl.style.color = "#ff4d4d";
            
            if (globalDataCache && globalDataCache.length > 0) {
                console.log("⚠️ 雖然本次更新失敗，但已為您載入上次成功的暫存資料進行即時倒數。");
                processTrainLogic(globalDataCache); 
            } else {
                document.getElementById("countdownDisplay").innerText = "無法載入";
                document.getElementById("locationDisplay").innerText = "相對位置：請檢查網路或權限";
            }
        }

        /**
         * 核心功能 2：列車時間比對與倒數切換主要邏輯 (整合雙重語音播報)
         */
        function processTrainLogic(sheetData) {
            if (!sheetData || sheetData.length <= 1) {
                document.getElementById("countdownDisplay").innerText = "無車次資料";
                return;
            }

            // 讀取當前選單的值
            const selectedDirection = document.getElementById("directionSelect").value;
            const alertSeconds = parseInt(document.getElementById("alertSelect").value, 10) || 45;

            // 欄位定義：方向一 = E欄 (索引4), 方向二 = B欄 (索引1), 相對位置 = G欄 (索引6)
            const timeColIndex = (selectedDirection === "方向一") ? 4 : 1;
            const gColIndex = 6; 

            const now = new Date();
            let targetRow = null;
            let minDiffSeconds = Infinity;

            // 從第二列（索引 1）開始過濾整張表
            for (let i = 1; i < sheetData.length; i++) {
                const row = sheetData[i];
                const timeValue = row[timeColIndex];
                
                if (!timeValue) continue; 

                // 轉成今日的正確時間物件
                const trainTime = parseToTodayDate(timeValue);
                if (!trainTime) continue;

                // 計算與現在時間的差距秒數
                const diffSeconds = Math.floor((trainTime - now) / 1000);

                // 【關鍵邏輯】車子開走超過 20 秒（即 diffSeconds < -20）才判定失效，否則一律保留顯示
                if (diffSeconds >= -20) {
                    // 尋找距離現在最近的那一班車
                    if (diffSeconds < minDiffSeconds) {
                        minDiffSeconds = diffSeconds;
                        targetRow = row;
                    }
                }
            }

            // UI 渲染與著色邏輯
            const countdownEl = document.getElementById("countdownDisplay");
            const locationEl = document.getElementById("locationDisplay");

            if (targetRow) {
                const locationG = targetRow[gColIndex] || "未註記位置";
                locationEl.innerText = `相對位置：${locationG}`;

                if (minDiffSeconds < 0) {
                    // 車子剛走，在 20 秒內的緩衝顯示狀態
                    countdownEl.innerText = `列車已過：${Math.abs(minDiffSeconds)} 秒`;
                    countdownEl.style.color = "#888888";
                    countdownEl.style.fontWeight = "normal";
                } else {
                    // 正常未到站倒數狀態
                    countdownEl.innerText = `${minDiffSeconds} 秒`;
                    
                    // 【提示秒數變色邏輯】進入警戒秒數範圍：變紅、變粗
                    if (minDiffSeconds <= alertSeconds) {
                        countdownEl.style.color = "#ff4d4d";
                        countdownEl.style.fontWeight = "bold";

                        // --- 【修改區】念出名字 + 請準備接車，重複兩次 ---
                        if (minDiffSeconds > 0 && locationG !== lastSpokenLocation) {
                            // 組合播報字串，加上逗號與句號讓 AI 語音停頓更自然
                            const alertPhrase = `${locationG}，請準備接車。${locationG}，請準備接車。`;
                            
                            console.log(`即將進入預警範圍，連續播報兩次：${alertPhrase}`);
                            speakLocation(alertPhrase); // 呼叫播報
                            lastSpokenLocation = locationG; // 鎖定此車次位置，避免每一秒重複呼叫
                        }
                        // ----------------------------------------------

                    } else {
                        countdownEl.style.color = "#ffffff";
                        countdownEl.style.fontWeight = "normal";
                    }
                }
            } else {
                countdownEl.innerText = "今日已無班次";
                countdownEl.style.color = "#888888";
                locationEl.innerText = "相對位置：--";
                lastSpokenLocation = null; // 重置標記
            }
        }

        /**
         * 新增功能：抓取 H8 儲存格 (陣列索引 [7][7]) 作為跑馬燈
         */
        function updateMarquee(sheetData) {
            const marqueeContainer = document.getElementById("marqueeContainer");
            const marqueeText = document.getElementById("marqueeText");
            
            // 檢查陣列長度是否包含 H8 (第8列=索引7，第8欄=索引7)
            if (sheetData && sheetData.length > 7 && sheetData[7].length > 7) {
                const h8Value = sheetData[7][7];
                // 如果有值且不為空字串，則顯示跑馬燈
                if (h8Value !== null && h8Value !== undefined && h8Value.toString().trim() !== "") {
                    marqueeText.innerText = h8Value.toString();
                    marqueeContainer.style.display = "block";
                    return;
                }
            }
            // 條件不符（無內容或超界）則隱藏
            marqueeContainer.style.display = "none";
        }

        /**
         * 輔助工具：念出文字內容
         */
        function speakLocation(text) {
            if ('speechSynthesis' in window) {
                // 如果前一班車還沒念完，先強制中斷，避免語音塞車延遲
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW'; // 設定台灣中文
                utterance.rate = 1.0;     // 語速 (1.0 為正常速度)
                
                window.speechSynthesis.speak(utterance);
            } else {
                console.warn("瀏覽器不支援語音合成功能。");
                document.getElementById("statusText").innerText = "狀態：瀏覽器不支援語音";
            }
        }

        /**
         * 輔助工具：精準解析 Google Sheet 時間欄位
         */
        function parseToTodayDate(input) {
            const today = new Date();
            if (!input) return null;

            // 處理 ISO 標準格式
            if (typeof input === "string" && input.includes("T")) {
                const d = new Date(input);
                d.setFullYear(today.getFullYear(), today.getMonth(), today.getDate());
                return d;
            }
            
            // 處理常見文字格式 (如 "08:30" 或 "14:25:00")
            const parts = input.toString().split(":");
            if (parts.length >= 2) {
                const hrs = parseInt(parts[0], 10);
                const mins = parseInt(parts[1], 10);
                const secs = parts[2] ? parseInt(parts[2], 10) : 0;
                
                const d = new Date();
                d.setHours(hrs, mins, secs, 0);
                return d;
            }
            return null;
        }

        // ==========================================
        //  計時器與事件監聽排程
        // ==========================================

        // 排程 1：每 5 分鐘自動在背景找 GAS 代理伺服器更新一次核心試算表資料
        setInterval(fetchTrainData, 5 * 60 * 1000);
        fetchTrainData(); // 初始化載入

        // 排程 2：每 1 秒鐘執行一次畫面重繪
        setInterval(() => {
            if (globalDataCache) {
                processTrainLogic(globalDataCache);
            }
        }, 1000);

        // 排程 3：切換監測方向時，立即重置播報鎖定，確保新方向的車次能立刻念出來
        document.getElementById("directionSelect").addEventListener("change", () => {
            lastSpokenLocation = null; 
            if (globalDataCache) processTrainLogic(globalDataCache);
        });
        document.getElementById("alertSelect").addEventListener("change", () => {
            if (globalDataCache) processTrainLogic(globalDataCache);
        });

    </script>
</body>
</html>
