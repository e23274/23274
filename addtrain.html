<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>當天車輛調度看板 (精確至秒)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background-color: #1a1b1e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin: 0 0 14px 0;
      color: #ffffff;
      font-size: 22px;
    }

    /* 頂部控制面板 */
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background-color: #262a34;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      margin-bottom: 16px;
      width: 100%;
      max-width: 1320px;
      justify-content: center;
      align-items: center;
    }
    .panel-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .badge-b {
      background-color: #2563eb;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 5px;
      font-weight: bold;
    }
    .badge-e {
      background-color: #16a34a;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 5px;
      font-weight: bold;
    }
    select, input {
      background-color: #333846;
      border: 1px solid #4b5563;
      color: #ffffff;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 13px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #3b82f6;
    }
    input[type="number"] {
      width: 65px;
      text-align: center;
    }
    .btn-action {
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .btn-reset {
      background-color: #4b5563;
      color: #ffffff;
    }
    .btn-apply {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-upload {
      background-color: #10b981; 
      color: #ffffff;
      margin-left: auto; 
    }
    .btn-action:hover {
      opacity: 0.85;
    }
    .btn-upload:disabled {
      background-color: #6ee7b7;
      cursor: not-allowed;
    }

    /* 看板表格容器 */
    #board-container {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      overflow-x: auto;
      max-height: 82vh;
      width: 100%;
      max-width: 1320px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: center;
      color: #0f172a;
    }
    thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }
    th {
      background-color: #1e293b;
      color: #ffffff;
      padding: 9px 6px;
      font-weight: 600;
      border: 1px solid #334155;
    }
    tr.sub-header th {
      background-color: #2c3e50;
      font-size: 12px;
      padding: 5px 6px;
      color: #cbd5e1;
    }

    th.th-blue, tr.sub-header th.th-blue {
      background-color: #1d4ed8;
      min-width: 100px;
    }
    th.th-green, tr.sub-header th.th-green {
      background-color: #15803d;
      min-width: 100px;
    }

    td {
      padding: 7px 8px;
      border: 1px solid #e2e8f0;
      white-space: nowrap;
    }
    tr:nth-child(even) {
      background-color: #f8fafc;
    }
    tr:hover {
      background-color: #f1f5f9;
    }

    /* 錨點端點時間：紅色粗體 */
    .time-anchor {
      color: #dc2626 !important;
      font-weight: bold !important;
    }

    /* B 欄錨點區間：淺藍色 */
    .cell-b-range {
      background-color: #dbeafe !important;
      color: #1e40af;
      font-weight: 500;
    }

    /* E 欄錨點區間：亮黃色 */
    .cell-e-range {
      background-color: #fef08a !important;
      color: #854d0e;
      font-weight: 500;
    }

    /* 新時間加亮字體 */
    .cell-modified-b {
      color: #1d4ed8;
      font-weight: bold;
      background-color: #eff6ff;
    }
    .cell-modified-e {
      color: #15803d;
      font-weight: bold;
      background-color: #f0fdf4;
    }
    .cell-audit {
      color: #64748b;
      font-size: 13px;
    }
    .msg-box {
      padding: 40px;
      text-align: center;
      color: #64748b;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <h2>當天車輛調度看板 (精確至秒)</h2>

  <div class="control-panel">
    <div class="panel-group">
      <span class="badge-b">B 欄加車</span>
      <label>起始：</label>
      <select id="bStart"><option value="">--請選擇--</option></select>
      <label>結束：</label>
      <select id="bEnd"><option value="">--請選擇--</option></select>
      <label>發車數量：</label>
      <input type="number" id="bCount" value="" min="1" placeholder="台數">
    </div>

    <div class="panel-group">
      <span class="badge-e">E 欄加車</span>
      <label>起始：</label>
      <select id="eStart"><option value="">--請選擇--</option></select>
      <label>結束：</label>
      <select id="eEnd"><option value="">--請選擇--</option></select>
      <label>發車數量：</label>
      <input type="number" id="eCount" value="" min="1" placeholder="台數">
    </div>

    <button type="button" class="btn-action btn-reset" id="btnReset">清除重設</button>
    <button type="button" class="btn-action btn-apply" id="btnApply">套用加車計算</button>
    <button type="button" class="btn-action btn-upload" id="btnUpload">上傳至試算表</button>
  </div>

  <div id="board-container">
    <div id="loading" class="msg-box">資料載入中，請稍候...</div>
    <table id="dataTable" style="display: none;">
      <thead>
        <tr>
          <th>欄位 C</th>
          <th class="th-blue">新 B 時間</th>
          <th>欄位 B</th>
          <th>欄位 D</th>
          <th>欄位 G</th>
          <th class="th-green">新 E 時間</th>
          <th>欄位 E</th>
          <th>欄位 F</th>
        </tr>
        <tr class="sub-header">
          <th>方向2車號</th>
          <th class="th-blue"></th>
          <th>方向2時間</th>
          <th>班型</th>
          <th>姓名</th>
          <th class="th-green"></th>
          <th>方向1時間</th>
          <th>方向1車號</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxMkTahf3GyuECOhpIeWDrwa0H4slg6b_CDnz0qgtAKTm4FDB-PjhJShaWU0lavlDBNNA/exec";
    const UPLOAD_URL = "https://script.google.com/macros/s/AKfycbwYHT6YdVUr-ozWCRBn-owZgL6QL_pk0c2SJ1pYAz67E-XQAVYYUfg9DOyy4tg1AwJ5/exec";

    let rawList = [];
    let currentExportData = []; 

    let bEarly = { start: null, end: null };
    let bLate  = { start: null, end: null };
    let eEarly = { start: null, end: null };
    let eLate  = { start: null, end: null };

    let bAnchors = [];
    let eAnchors = [];

    function formatTo24HourTime(val) {
      if (val === null || val === undefined || val === "") return "";
      let res = "";
      if (typeof val === "string") {
        val = val.trim();
        if (!val || val.includes("#N/A") || val.includes("N/A")) return "";
        val = val.replace(/\s+/g, ":");
        const m = val.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
        if (m) {
          const hh = m[1].padStart(2, "0");
          const mm = m[2];
          const ss = m[3] ? m[3].padStart(2, "0") : "00";
          res = `${hh}:${mm}:${ss}`;
        } else {
          try {
            const d = new Date(val);
            if (!isNaN(d.getTime())) res = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
            else res = val;
          } catch(e) { res = val; }
        }
      } else if (typeof val === "number") {
        if (val === 0) return "";
        if (val > 0 && val < 1) {
          const totalSec = Math.round(val * 86400);
          const hh = String(Math.floor(totalSec / 3600)).padStart(2, "0");
          const mm = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
          const ss = String(totalSec % 60).padStart(2, "0");
          res = `${hh}:${mm}:${ss}`;
        } else {
          res = String(val);
        }
      } else {
        try {
          if (val instanceof Date) res = `${String(val.getHours()).padStart(2, '0')}:${String(val.getMinutes()).padStart(2, '0')}:${String(val.getSeconds()).padStart(2, '0')}`;
          else res = String(val);
        } catch(e) { res = String(val); }
      }
      if (res === "00:00:00") return "";
      return res;
    }

    function timeToSeconds(tStr) {
      if (!tStr) return NaN;
      const parts = tStr.split(":").map(Number);
      if (parts.length === 2) return parts[0] * 3600 + parts[1] * 60;
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      return NaN;
    }

    function secondsToTime(totalSec) {
      totalSec = Math.round(totalSec) % 86400;
      if (totalSec < 0) totalSec += 86400;
      const hh = String(Math.floor(totalSec / 3600)).padStart(2, "0");
      const mm = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      const ss = String(totalSec % 60).padStart(2, "0");
      return `${hh}:${mm}:${ss}`;
    }

    function isInsideRange(idx, early, late) {
      const inEarly = early.start !== null && early.end !== null && idx > early.start && idx < early.end;
      const inLate  = late.start !== null && late.end !== null && idx > late.start && idx < late.end;
      return inEarly || inLate;
    }

    function generateSmartTripTimes(startStr, endStr, count, startIdx, endIdx, earlyRange, lateRange) {
      if (!startStr || !endStr || !count || count <= 0) return [];
      const startSec = timeToSeconds(startStr);
      const endSec = timeToSeconds(endStr);
      if (isNaN(startSec) || isNaN(endSec) || endSec < startSec) return [];

      if (count === 1) return [secondsToTime(startSec)];

      const OFFSET = 150; 
      const startIn = isInsideRange(startIdx, earlyRange, lateRange);
      const endIn = isInsideRange(endIdx, earlyRange, lateRange);

      if (!startIn && endIn) {
        const effSpan = (endSec - OFFSET) - startSec;
        const step = effSpan / (count - 1);
        const times = [];
        for (let i = 0; i < count; i++) {
          const curIdx = startIdx + i;
          const curIn = isInsideRange(curIdx, earlyRange, lateRange);
          const t = startSec + i * step + (curIn ? OFFSET : 0);
          times.push(secondsToTime(t));
        }
        return times;
      }

      if (startIn && !endIn) {
        const effStart = startSec + OFFSET;
        const step = (endSec - effStart) / (count - 1);
        const times = [];
        for (let i = 0; i < count; i++) {
          const curIdx = startIdx + i;
          const curIn = isInsideRange(curIdx, earlyRange, lateRange);
          const t = effStart + i * step - (curIn ? OFFSET : 0);
          times.push(secondsToTime(t));
        }
        return times;
      }

      const step = (endSec - startSec) / (count - 1);
      const times = [];
      for (let i = 0; i < count; i++) {
        times.push(secondsToTime(startSec + i * step));
      }
      return times;
    }

    async function init() {
      try {
        const response = await fetch(API_URL);
        const result = await response.json();
        if (result.status !== "success") {
          document.getElementById("loading").innerText = "讀取錯誤: " + result.message;
          return;
        }

        const allData = result.data;
        const rawRows = allData.slice(8, 500);
        rawList = [];

        const bTimesSet = new Set();
        const eTimesSet = new Set();

        for (let row of rawRows) {
          const item = {
            c: row[2] !== undefined ? String(row[2]).trim() : "",
            b: formatTo24HourTime(row[1]),
            d: row[3] !== undefined ? String(row[3]).trim() : "",
            g: row[6] !== undefined ? String(row[6]).trim() : "",
            e: formatTo24HourTime(row[4]),
            f: row[5] !== undefined ? String(row[5]).trim() : ""
          };

          if (Object.values(item).some(v => v !== "")) {
            rawList.push(item);
            if (item.b && item.b.includes(":")) bTimesSet.add(item.b);
            if (item.e && item.e.includes(":")) eTimesSet.add(item.e);
          }
        }

        function getCellInt(row1Based, colLetter) {
          const r = row1Based - 1;
          const c = colLetter === 'O' ? 14 : 15;
          if (allData[r] && allData[r][c] !== undefined && allData[r][c] !== "") {
            const rawVal = String(allData[r][c]).trim();
            if (rawVal.includes("#N/A") || rawVal.includes("N/A")) return null;
            const v = parseInt(rawVal, 10);
            return isNaN(v) ? null : v;
          }
          return null;
        }

        const bIdx26 = getCellInt(26, 'O');
        const bIdx27 = getCellInt(27, 'O');
        const bIdx34 = getCellInt(34, 'O');
        const bIdx35 = getCellInt(35, 'O');

        const eIdx26 = getCellInt(26, 'P');
        const eIdx27 = getCellInt(27, 'P');
        const eIdx34 = getCellInt(34, 'P');
        const eIdx35 = getCellInt(35, 'P');

        function makeRange(idxA, idxB) {
          if (idxA !== null && idxB !== null) return { start: Math.min(idxA, idxB), end: Math.max(idxA, idxB) };
          return { start: null, end: null };
        }

        bEarly = makeRange(bIdx26, bIdx27);
        bLate  = makeRange(bIdx34, bIdx35);
        eEarly = makeRange(eIdx26, eIdx27);
        eLate  = makeRange(eIdx34, eIdx35);

        bAnchors = [bIdx26, bIdx27, bIdx34, bIdx35].filter(idx => idx !== null);
        eAnchors = [eIdx26, eIdx27, eIdx34, eIdx35].filter(idx => idx !== null);

        populateDropdown("bStart", bTimesSet);
        populateDropdown("bEnd", bTimesSet);
        populateDropdown("eStart", eTimesSet);
        populateDropdown("eEnd", eTimesSet);

        document.getElementById("loading").style.display = "none";
        document.getElementById("dataTable").style.display = "table";

        updateTable();
      } catch (e) {
        document.getElementById("loading").innerText = "無法載入資料，請確認網路連線！";
      }
    }

    function populateDropdown(elemId, timeSet) {
      const select = document.getElementById(elemId);
      select.innerHTML = '<option value="">--請選擇--</option>';
      timeSet.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
      });
    }

    // 建立合併列：依照「B為排版主體，中間跟隨B」的邏輯
    function createMergedRow(bItem, eItem) {
      return {
        c: bItem ? bItem.c : "",
        newBTime: bItem ? bItem.oldB : "",
        b: bItem ? bItem.time : "",
        d: bItem ? bItem.d : "",
        g: bItem ? bItem.g : "",
        newETime: eItem ? eItem.oldE : "",
        e: eItem ? eItem.time : "",
        f: eItem ? eItem.f : "",
        isBModified: bItem ? bItem.isModified : false,
        isEModified: eItem ? eItem.isModified : false,
        isAnchorB: bItem ? bItem.isAnchor : false,
        isAnchorE: eItem ? eItem.isAnchor : false,
        inBRange: bItem ? bItem.inRange : false,
        inERange: eItem ? eItem.inRange : false
      };
    }

    function updateTable() {
      const bStart = document.getElementById("bStart").value;
      const bEnd = document.getElementById("bEnd").value;
      const bCount = parseInt(document.getElementById("bCount").value, 10);

      const eStart = document.getElementById("eStart").value;
      const eEnd = document.getElementById("eEnd").value;
      const eCount = parseInt(document.getElementById("eCount").value, 10);

      const hasB = bStart && bEnd && bCount > 0;
      const hasE = eStart && eEnd && eCount > 0;

      // 如果都沒有加車，直接呈現原表
      if (!hasB && !hasE) {
        renderRows(rawList.map((r, idx) => ({
          c: r.c, newBTime: "", b: r.b, d: r.d, g: r.g,
          newETime: "", e: r.e, f: r.f,
          isBModified: false, isEModified: false,
          isAnchorB: bAnchors.includes(idx), isAnchorE: eAnchors.includes(idx),
          inBRange: isInsideRange(idx, bEarly, bLate) && !bAnchors.includes(idx),
          inERange: isInsideRange(idx, eEarly, eLate) && !eAnchors.includes(idx)
        })));
        return;
      }

      const bStartIdx = hasB ? rawList.findIndex(r => r.b === bStart) : -1;
      const bEndIdx = hasB ? rawList.findIndex(r => r.b === bEnd) : -1;
      const eStartIdx = hasE ? rawList.findIndex(r => r.e === eStart) : -1;
      const eEndIdx = hasE ? rawList.findIndex(r => r.e === eEnd) : -1;

      const validBStart = hasB ? bStartIdx : Infinity;
      const validEStart = hasE ? eStartIdx : Infinity;
      const segStart = Math.min(validBStart, validEStart);
      
      const validBEnd = hasB ? Math.max(bEndIdx, bStartIdx + bCount - 1) : -1;
      const validEEnd = hasE ? Math.max(eEndIdx, eStartIdx + eCount - 1) : -1;
      const segEnd = Math.max(validBEnd, validEEnd);

      const bNewList = (hasB && bStartIdx !== -1) ? generateSmartTripTimes(bStart, bEnd, bCount, bStartIdx, bEndIdx, bEarly, bLate) : [];
      const eNewList = (hasE && eStartIdx !== -1) ? generateSmartTripTimes(eStart, eEnd, eCount, eStartIdx, eEndIdx, eEarly, eLate) : [];

      // ==============================================
      // 1. 建立獨立運算的 B佇列 與 E佇列 (包含區間內所有新舊時間)
      // ==============================================
      let bQueue = [];
      let eQueue = [];

      for (let i = segStart; i <= segEnd; i++) {
        let r = rawList[i]; // i 超過 rawList.length 時會是 undefined (擴充列)
        
        // --- 準備 B 屬性 ---
        let bTime = "", oldB = "", isBNew = false;
        if (hasB && i >= bStartIdx && i < bStartIdx + bCount) {
          isBNew = true;
          bTime = bNewList[i - bStartIdx];
          oldB = (r && i <= bEndIdx) ? r.b : "";
        } else {
          bTime = r ? r.b : "";
        }

        let inBRange = false, isBAnchor = false;
        if (r) {
          isBAnchor = bAnchors.includes(i);
          inBRange = isInsideRange(i, bEarly, bLate) && !isBAnchor;
        } else if (hasB && i > bEndIdx) {
          if (rawList[bEndIdx]) inBRange = isInsideRange(bEndIdx, bEarly, bLate) && !bAnchors.includes(bEndIdx);
        }

        bQueue.push({
          time: bTime, timeSec: timeToSeconds(bTime),
          c: r ? r.c : "", oldB: oldB, d: r ? r.d : "", g: r ? r.g : "",
          isModified: isBNew, isAnchor: isBAnchor, inRange: inBRange
        });

        // --- 準備 E 屬性 ---
        let eTime = "", oldE = "", isENew = false;
        if (hasE && i >= eStartIdx && i < eStartIdx + eCount) {
          isENew = true;
          eTime = eNewList[i - eStartIdx];
          oldE = (r && i <= eEndIdx) ? r.e : "";
        } else {
          eTime = r ? r.e : "";
        }

        let inERange = false, isEAnchor = false;
        if (r) {
          isEAnchor = eAnchors.includes(i);
          inERange = isInsideRange(i, eEarly, eLate) && !isEAnchor;
        } else if (hasE && i > eEndIdx) {
          if (rawList[eEndIdx]) inERange = isInsideRange(eEndIdx, eEarly, eLate) && !eAnchors.includes(eEndIdx);
        }

        eQueue.push({
          time: eTime, timeSec: timeToSeconds(eTime),
          oldE: oldE, f: r ? r.f : "",
          isModified: isENew, isAnchor: isEAnchor, inRange: inERange
        });
      }

      // ==============================================
      // 2. 啟動「動態錯位對齊引擎」 (The Match Engine)
      // ==============================================
      let mergedRows = [];
      let bIdx = 0;
      let eIdx = 0;

      while (bIdx < bQueue.length || eIdx < eQueue.length) {
        let bItem = bIdx < bQueue.length ? bQueue[bIdx] : null;
        let eItem = eIdx < eQueue.length ? eQueue[eIdx] : null;

        if (bItem && eItem) {
          let bSec = bItem.timeSec;
          let eSec = eItem.timeSec;

          // 如果任一方為空白(NaN)，強制配對合併以維持版面整齊
          if (isNaN(bSec) || isNaN(eSec)) {
            mergedRows.push(createMergedRow(bItem, eItem));
            bIdx++; eIdx++;
            continue;
          }

          // 判斷雙方所處的錨點狀態 (尖峰/離峰)
          let isBInside = bItem.inRange || bItem.isAnchor;
          let isEInside = eItem.inRange || eItem.isAnchor;
          
          // 動態變速門檻設定
          let thresholdSec = 660; // 預設：都在外 11 分鐘
          if (isBInside && isEInside) {
            thresholdSec = 270;   // 等級三：都在內 4.5 分鐘
          } else if (isBInside || isEInside) {
            thresholdSec = 420;   // 等級二：一內一外 7 分鐘
          }

          // 計算實體時間差 (並過濾跨午夜狀況)
          let diff = eSec - bSec;
          if (diff < -43200) diff += 86400;      // E跨越到了隔天
          else if (diff > 43200) diff -= 86400;  // B跨越到了隔天
          
          if (diff >= thresholdSec) {
            // 時間差達標！雙方完美合併在同一列
            mergedRows.push(createMergedRow(bItem, eItem));
            bIdx++; eIdx++;
          } else {
            // 時間差不足 (太早了來不及)，E欄被迫提早出發，B欄留白等待下一個E！
            mergedRows.push(createMergedRow(null, eItem));
            eIdx++;
          }

        } else if (bItem) {
          // 只剩下 B 佇列有資料
          mergedRows.push(createMergedRow(bItem, null));
          bIdx++;
        } else if (eItem) {
          // 只剩下 E 佇列有資料
          mergedRows.push(createMergedRow(null, eItem));
          eIdx++;
        }
      }

      // ==============================================
      // 3. 組裝最終表格 (結合 加車前 + 錯位區 + 加車後)
      // ==============================================
      let displayRows = [];
      
      // 加入區間前的原始資料
      for (let i = 0; i < segStart; i++) {
        let r = rawList[i];
        displayRows.push({
          c: r.c, newBTime: "", b: r.b, d: r.d, g: r.g,
          newETime: "", e: r.e, f: r.f,
          isBModified: false, isEModified: false,
          isAnchorB: bAnchors.includes(i), isAnchorE: eAnchors.includes(i),
          inBRange: isInsideRange(i, bEarly, bLate) && !bAnchors.includes(i),
          inERange: isInsideRange(i, eEarly, eLate) && !eAnchors.includes(i)
        });
      }

      // 貼上經過引擎配對好的錯位區
      displayRows = displayRows.concat(mergedRows);

      // 加入區間後的原始資料 (回歸原表對齊)
      for (let i = segEnd + 1; i < rawList.length; i++) {
        let r = rawList[i];
        displayRows.push({
          c: r.c, newBTime: "", b: r.b, d: r.d, g: r.g,
          newETime: "", e: r.e, f: r.f,
          isBModified: false, isEModified: false,
          isAnchorB: bAnchors.includes(i), isAnchorE: eAnchors.includes(i),
          inBRange: isInsideRange(i, bEarly, bLate) && !bAnchors.includes(i),
          inERange: isInsideRange(i, eEarly, eLate) && !eAnchors.includes(i)
        });
      }

      renderRows(displayRows);
    }

    function renderRows(rows) {
      currentExportData = rows; 
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      rows.forEach(r => {
        const tr = document.createElement("tr");

        let bClass = r.isAnchorB ? "time-anchor" : r.isBModified ? "cell-modified-b" : r.inBRange ? "cell-b-range" : "";
        let eClass = r.isAnchorE ? "time-anchor" : r.isEModified ? "cell-modified-e" : r.inERange ? "cell-e-range" : "";

        tr.innerHTML = `
          <td>${r.c}</td>
          <td class="cell-audit">${r.newBTime}</td>
          <td class="${bClass}">${r.b}</td>
          <td>${r.d}</td>
          <td>${r.g}</td>
          <td class="cell-audit">${r.newETime}</td>
          <td class="${eClass}">${r.e}</td>
          <td>${r.f}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById("btnApply").addEventListener("click", updateTable);

    document.getElementById("btnReset").addEventListener("click", () => {
      document.getElementById("bStart").value = "";
      document.getElementById("bEnd").value = "";
      document.getElementById("bCount").value = "";
      document.getElementById("eStart").value = "";
      document.getElementById("eEnd").value = "";
      document.getElementById("eCount").value = "";
      updateTable();
    });

    document.getElementById("btnUpload").addEventListener("click", async () => {
      if (!currentExportData || currentExportData.length === 0) {
        alert("目前沒有資料可以上傳！");
        return;
      }
      
      const btn = document.getElementById("btnUpload");
      btn.innerText = "資料上傳中...";
      btn.disabled = true;

      try {
        const response = await fetch(UPLOAD_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          redirect: "follow", 
          body: JSON.stringify({ data: currentExportData })
        });
        
        const result = await response.json();
        if (result.status === "success") {
          alert("上傳成功！已成功覆蓋更新： " + result.sheetName);
        } else {
          alert("上傳失敗：" + result.message);
        }
      } catch (error) {
        alert("發生錯誤，請檢查網路連線或 Apps Script 權限設定。\n錯誤訊息: " + error);
      } finally {
        btn.innerText = "上傳至試算表";
        btn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
